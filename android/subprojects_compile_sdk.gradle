// Força compileSdk 37 e JVM 17 em todos os módulos Android (plugins Flutter legados).
subprojects { sub ->
    sub.afterEvaluate {
        if (sub.plugins.hasPlugin("com.android.library") || sub.plugins.hasPlugin("com.android.application")) {
            def androidExt = sub.extensions.findByName("android")
            if (androidExt != null) {
                try {
                    androidExt.compileSdk = 37
                } catch (Exception ignored) {
                    try {
                        androidExt.compileSdkVersion 37
                    } catch (Exception ignored2) {
                    }
                }
                try {
                    androidExt.compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                } catch (Exception ignored3) {
                }
            }
        }
        sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}
