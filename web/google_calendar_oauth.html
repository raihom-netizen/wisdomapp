<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WISDOMAPP — Google Calendar</title>
  <script src="/google-oauth-config.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #061428, #0A1F56);
      color: #fff;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      padding: 28px 22px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #4285F4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { opacity: 0.88; line-height: 1.45; font-size: 14px; margin: 0; }
    .hint { margin-top: 12px; font-size: 12px; opacity: 0.65; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spin"></div>
    <p id="msg">Conectando ao Google Calendar…</p>
    <p class="hint" id="hint"></p>
  </div>
  <script>
    (function () {
      var CFG = window.WISDOMAPP_OAUTH || {};
      var CLIENT_ID = CFG.webClientId || '766524666378-ce9albkkvn01si77s6ofcqvoaatn29s0.apps.googleusercontent.com';
      var REDIRECT_URI = CFG.redirectUri || 'https://wisdomapp-b9e98.web.app/google_calendar_oauth.html';
      var PRIMARY_ORIGIN = CFG.primaryOrigin || 'https://wisdomapp-b9e98.web.app';
      var CODE_KEY = 'wisdomapp_gcal_auth_code';
      var STATE_KEY = 'wisdomapp_gcal_oauth_state';
      var RETURN_KEY = 'wisdomapp_gcal_return';
      var ENABLE_UID_KEY = 'wisdomapp_gcal_enable_uid';
      var SCOPE = (CFG.calendarScope || 'https://www.googleapis.com/auth/calendar.events') +
        ' openid email profile';

      function setMsg(t, hint) {
        var el = document.getElementById('msg');
        if (el) el.textContent = t;
        var h = document.getElementById('hint');
        if (h) h.textContent = hint || '';
      }

      function parseHash() {
        var out = {};
        var h = (window.location.hash || '').replace(/^#/, '');
        if (!h) return out;
        h.split('&').forEach(function (part) {
          var i = part.indexOf('=');
          if (i < 0) return;
          out[decodeURIComponent(part.slice(0, i))] = decodeURIComponent(part.slice(i + 1));
        });
        return out;
      }

      function safeReturnUrl(raw) {
        if (!raw || typeof raw !== 'string') return PRIMARY_ORIGIN + '/';
        try {
          var u = new URL(raw);
          var allowed = (CFG.authorizedOrigins || []).concat([PRIMARY_ORIGIN, window.location.origin]);
          if (allowed.indexOf(u.origin) < 0) return PRIMARY_ORIGIN + '/';
          return u.href;
        } catch (e) {
          return PRIMARY_ORIGIN + '/';
        }
      }

      function finishReturn(extraQuery) {
        var ret = safeReturnUrl(sessionStorage.getItem(RETURN_KEY) || PRIMARY_ORIGIN + '/');
        sessionStorage.removeItem(RETURN_KEY);
        sessionStorage.removeItem(STATE_KEY);
        var u = new URL(ret);
        var sep = u.search ? '&' : '?';
        var q = extraQuery || 'gcal=ok';
        u.search += sep + q;
        window.location.replace(u.href);
      }

      function finishReturnCrossOrigin(returnUrl, payload) {
        sessionStorage.removeItem(RETURN_KEY);
        sessionStorage.removeItem(STATE_KEY);
        var u = new URL(returnUrl);
        var base = u.origin + u.pathname + u.search;
        var encoded = encodeURIComponent(JSON.stringify(payload));
        window.location.replace(base + '#gcal_payload=' + encoded);
      }

      function failReturn(code) {
        finishReturn('gcal_error=' + encodeURIComponent(code || 'unknown'));
      }

      function deliverAuthCode(code) {
        var returnUrl = safeReturnUrl(sessionStorage.getItem(RETURN_KEY) || PRIMARY_ORIGIN + '/');
        var returnOrigin = new URL(returnUrl).origin;
        var enableUid = sessionStorage.getItem(ENABLE_UID_KEY) || '';
        var payload = { authorization_code: code };
        if (enableUid) payload.enable_uid = enableUid;

        if (returnOrigin !== window.location.origin) {
          finishReturnCrossOrigin(returnUrl, payload);
          return;
        }

        sessionStorage.setItem(CODE_KEY, code);
        finishReturn('gcal=ok');
      }

      var qs = new URLSearchParams(window.location.search);
      var hash = parseHash();

      if (hash.error || qs.get('error')) {
        document.getElementById('spin').style.display = 'none';
        var err = hash.error || qs.get('error');
        if (err === 'redirect_uri_mismatch') {
          setMsg(
            'Redirect URI não autorizado no Google Cloud.',
            'Adicione exatamente: ' + REDIRECT_URI
          );
          failReturn('redirect_uri_mismatch');
          return;
        }
        if ((err === 'interaction_required' || err === 'login_required' || err === 'consent_required')
            && qs.get('silent') === '1' && qs.get('force_consent') !== '1') {
          var retryQs = new URLSearchParams(window.location.search);
          retryQs.delete('silent');
          retryQs.set('force_consent', '1');
          retryQs.set('start', '1');
          window.location.replace(PRIMARY_ORIGIN + '/google_calendar_oauth.html?' + retryQs.toString());
          return;
        }
        failReturn(err);
        return;
      }

      // Google retornou ?code=… (Authorization Code Flow)
      var authCode = qs.get('code');
      if (authCode) {
        var savedState = sessionStorage.getItem(STATE_KEY);
        var returnedState = qs.get('state');
        if (savedState && returnedState && savedState !== returnedState) {
          failReturn('state_mismatch');
          return;
        }
        deliverAuthCode(authCode);
        return;
      }

      // Iniciar fluxo OAuth (?start=1)
      if (qs.get('start') !== '1') {
        document.getElementById('spin').style.display = 'none';
        setMsg('Link inválido. Volte ao WISDOMAPP e tente de novo.');
        return;
      }

      if (window.location.origin !== PRIMARY_ORIGIN) {
        var forward = PRIMARY_ORIGIN + '/google_calendar_oauth.html?' + window.location.search;
        window.location.replace(forward);
        return;
      }

      var ret = safeReturnUrl(qs.get('return') || PRIMARY_ORIGIN + '/');
      sessionStorage.setItem(RETURN_KEY, ret);

      var enableUid = qs.get('enable_uid') || '';
      if (enableUid) sessionStorage.setItem(ENABLE_UID_KEY, enableUid);

      var state = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(36).slice(2);
      sessionStorage.setItem(STATE_KEY, state);

      var params = {
        client_id: CLIENT_ID,
        redirect_uri: REDIRECT_URI,
        response_type: 'code',
        scope: SCOPE,
        state: state,
        access_type: 'offline',
        include_granted_scopes: 'true'
      };

      var email = (qs.get('email') || '').trim();
      if (email) params.login_hint = email;

      if (qs.get('select_account') === '1') {
        params.prompt = 'consent select_account';
      } else if (qs.get('force_consent') === '1') {
        params.prompt = 'consent';
      } else if (qs.get('silent') === '1') {
        params.prompt = 'none';
      }
      // Sem prompt: Google reutiliza sessão já autorizada (menos telas assustadoras).

      var authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
        Object.keys(params).map(function (k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }).join('&');

      setMsg('Redirecionando para o Google…', REDIRECT_URI);
      window.location.assign(authUrl);
    })();
  </script>
</body>
</html>
